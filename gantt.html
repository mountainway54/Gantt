      '<alignment horizontal="center" vertical="center" wrapText="1"/></xf>' +
    '<xf numFmtId="14" fontId="0" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyBorder="1" applyAlignment="1">' +
      '<alignment horizontal="center" vertical="center"/></xf>' +
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1">' +
      '<alignment vertical="center" wrapText="1"/></xf>';
  for (let i = 0; i < taskCount; i++) {
    xfs += `<xf numFmtId="0" fontId="0" fillId="${3 + i}" borderId="1" xfId="0" applyFill="1" applyBorder="1"/>`;
  }

  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<fonts count="4">
<font><sz val="11"/><name val="Microsoft JhengHei"/></font>
<font><b/><sz val="11"/><name val="Microsoft JhengHei"/></font>
<font><b/><sz val="16"/><color rgb="FF0F172A"/><name val="Microsoft JhengHei"/></font>
<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Microsoft JhengHei"/></font>
</fonts>
<fills count="${fills.length}">${fills.join('')}</fills>
<borders count="2">
<border><left/><right/><top/><bottom/><diagonal/></border>
<border><left style="thin"><color rgb="FFD9E1EC"/></left><right style="thin"><color rgb="FFD9E1EC"/></right><top style="thin"><color rgb="FFD9E1EC"/></top><bottom style="thin"><color rgb="FFD9E1EC"/></bottom><diagonal/></border>
</borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="${6 + taskCount}">${xfs}</cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
</styleSheet>`;
}

function exportXlsx() {
  try {
    const base = computeBase();
    const tasks = state.tasks;
    const n = tasks.length;
    const weeks = [];
    for (let i = 0; i < base.days; i += 7) weeks.push(addDays(base.start, i));
    const totalCols = 8 + weeks.length;
    const lastRow = 5 + Math.max(n, 1);

    const rowXml = (r, cells, ht) =>
      `<row r="${r}"${ht ? ` ht="${ht}" customHeight="1"` : ''}>${cells.join('')}</row>`;

    const rows = [];
    rows.push(rowXml(1, [xlsxCell('A1', (state.project || '未命名專案').trim(), 1)], 26));

    rows.push(rowXml(2, [
      xlsxCell('A2', '專案開始', 2),
      xlsxCell('B2', excelSerial(parseISO(state.start)), 4),
      xlsxCell('C2', '專案結束', 2),
      xlsxCell('D2', excelSerial(base.maxDate), 4),
      xlsxCell('E2', '任務數', 2),
      xlsxCell('F2', n, 5)
    ], 20));

    rows.push(rowXml(3, [
      xlsxCell('A3', '專案期間', 2),
      xlsxCell('B3', `${fmtDate(base.minDate)} – ${fmtDate(base.maxDate)}（${spanWeeks(base)} 週）`, 5)
    ], 20));

    rows.push(rowXml(4, [], 8));

    const head = [
      xlsxCell('A5', '任務', 3),
      xlsxCell('B5', '負責人', 3),
      xlsxCell('C5', '開始', 3),
      xlsxCell('D5', '結束', 3),
      xlsxCell('E5', '工期(天)', 3),
      xlsxCell('F5', '備註（資源限制）', 3),
      xlsxCell('G5', '前置任務', 3),
      xlsxCell('H5', '樣式', 3)
    ];
    const styleName = { solid: '實心', dashed: '虛線', dotted: '點線' };
    weeks.forEach((w, i) => {
      head.push(xlsxCell(`${colName(9 + i)}5`, `第${isoWeek(w)}週\n${w.getMonth() + 1}/${w.getDate()}`, 3));
    });
    rows.push(rowXml(5, head, 32));

    const sd = parseISO(state.start);
    tasks.forEach((t, i) => {
      const r = 6 + i;
      const predNames = predTasks(t).map(p => p.name || '未命名任務').join('、');
      const cells = [
        xlsxCell(`A${r}`, t.name || '（未命名任務）', 5),
        xlsxCell(`B${r}`, t.owner || '', 5),
        xlsxCell(`C${r}`, excelSerial(parseISO(t.start) || sd), 4),
        xlsxCell(`D${r}`, excelSerial(parseISO(t.end) || sd), 4),
        xlsxCell(`E${r}`, Math.max(1, daysInclusive(t.start, t.end)), 5),
        xlsxCell(`F${r}`, t.note || '', 5),
        xlsxCell(`G${r}`, predNames || '—', 5),
        xlsxCell(`H${r}`, `${styleName[t.style] || '實心'} ${t.color.toUpperCase()}`, 5)
      ];
      const ts = parseISO(t.start), te = parseISO(t.end);
      if (ts && te) {
        weeks.forEach((w, wi) => {
          const ws = w, we = addDays(w, 6);
          if (ts <= we && te >= ws) cells.push(xlsxCell(`${colName(9 + wi)}${r}`, '', 6 + i));
        });
      }
      rows.push(rowXml(r, cells, 22));
    });

    if (!n) rows.push(rowXml(6, [xlsxCell('A6', '（尚無任務）', 5)], 22));

    const cols = [
      '<col min="1" max="1" width="30" customWidth="1"/>',
      '<col min="2" max="2" width="14" customWidth="1"/>',
      '<col min="3" max="4" width="12.5" customWidth="1"/>',
      '<col min="5" max="5" width="10" customWidth="1"/>',
      '<col min="6" max="6" width="40" customWidth="1"/>',
      '<col min="7" max="7" width="24" customWidth="1"/>',
      '<col min="8" max="8" width="15" customWidth="1"/>'
    ];
    if (weeks.length) cols.push(`<col min="9" max="${8 + weeks.length}" width="8" customWidth="1"/>`);

    const landscape = state.ui.orient === 'landscape';
    const sheetXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>
<dimension ref="A1:${colName(totalCols)}${lastRow}"/>
<sheetViews><sheetView tabSelected="1" workbookViewId="0">
<pane xSplit="8" ySplit="5" topLeftCell="I6" activePane="bottomRight" state="frozen"/>
</sheetView></sheetViews>
<sheetFormatPr defaultRowHeight="18"/>
<cols>${cols.join('')}</cols>
<sheetData>${rows.join('')}</sheetData>
<mergeCells count="1"><mergeCell ref="A1:H1"/></mergeCells>
<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/>
<pageSetup paperSize="9" orientation="${landscape ? 'landscape' : 'portrait'}" fitToWidth="1" fitToHeight="0"/>
</worksheet>`;

    const files = [
      {
        name: '[Content_Types].xml',
        data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
</Types>`
      },
      {
        name: '_rels/.rels',
        data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`
      },
      {
        name: 'xl/workbook.xml',
        data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets><sheet name="甘特圖" sheetId="1" r:id="rId1"/></sheets>
</workbook>`
      },
      {
        name: 'xl/_rels/workbook.xml.rels',
        data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>
<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`
      },
      { name: 'xl/styles.xml', data: buildStylesXml(n) },
      { name: 'xl/worksheets/sheet1.xml', data: sheetXml }
    ];

    downloadBlob(zipStore(files), fileBase() + '.xlsx');
    toast('Excel 已匯出（含每週色塊）');
  } catch (err) {
    console.error(err);
    toast('Excel 匯出失敗：' + err.message);
  }
}

/* =========================================================
   10-1. 面板寬度 / 甘特圖欄寬調整
   ========================================================= */
function applyPanelWidth() {
  const panel = $('.panel');
  if (!panel) return;
  const max = Math.max(PANEL_MIN, Math.min(720, window.innerWidth - 420));
  const w = clamp(Number(state.ui.panelW) || 404, PANEL_MIN, max);
  panel.style.width = Math.round(w) + 'px';
}

function bindSplitter() {
  const sp = $('#splitter');
  const panel = $('.panel');
  if (!sp || !panel) return;
  let drag = null;

  sp.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    drag = { x: e.clientX, w: panel.getBoundingClientRect().width };
    sp.classList.add('active');
    document.body.classList.add('resizing');
    try { sp.setPointerCapture(e.pointerId); } catch (err) { /* noop */ }
  });

  sp.addEventListener('pointermove', e => {
    if (!drag) return;
    const max = Math.max(PANEL_MIN, Math.min(720, window.innerWidth - 420));
    state.ui.panelW = Math.round(clamp(drag.w + (e.clientX - drag.x), PANEL_MIN, max));
    panel.style.width = state.ui.panelW + 'px';
    render();
  });

  const end = e => {
    if (!drag) return;
    drag = null;
    sp.classList.remove('active');
    document.body.classList.remove('resizing');
    try { sp.releasePointerCapture(e.pointerId); } catch (err) { /* noop */ }
    render(); save();
  };
  sp.addEventListener('pointerup', end);
  sp.addEventListener('pointercancel', end);

  sp.addEventListener('dblclick', () => {
    state.ui.panelW = 404;
    applyPanelWidth();
    render(); save();
    toast('已還原面板寬度');
  });
}

function bindLabelResize() {
  const pane = $('#labelPane');
  if (!pane) return;

  const hit = ev => {
    const L = currentLayout;
    if (!L) return null;
    const r = pane.getBoundingClientRect();
    const x = ev.clientX - r.left;
    if (Math.abs(x - L.labelW) <= 5) return 'label';
    if (Math.abs(x - (L.labelW + L.ownerW)) <= 6) return 'owner';
    return null;
  };

  let drag = null;

  pane.addEventListener('pointermove', e => {
    if (drag) {
      const dx = e.clientX - drag.x;
      if (drag.kind === 'label') {
        state.ui.labelW = Math.round(clamp(drag.labelW + dx, LABEL_MIN, 460));
      } else {
        state.ui.ownerW = Math.round(clamp(drag.ownerW + dx, OWNER_MIN, 260));
      }
      render();
      return;
    }
    const h = hit(e);
    pane.style.cursor = h ? 'col-resize' : '';
    if (state.ui.colHover !== h) {
      state.ui.colHover = h;
      render();
    }
  });

  pane.addEventListener('pointerleave', () => {
    if (drag) return;
    pane.style.cursor = '';
    if (state.ui.colHover) { state.ui.colHover = null; render(); }
  });

  pane.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    const kind = hit(e);
    if (!kind) return;
    const L = currentLayout;
    drag = { kind, x: e.clientX, labelW: L.labelW, ownerW: L.ownerW };
    document.body.classList.add('resizing');
    pane.style.cursor = 'col-resize';
    try { pane.setPointerCapture(e.pointerId); } catch (err) { /* noop */ }
  });

  const end = e => {
    if (!drag) return;
    drag = null;
    document.body.classList.remove('resizing');
    pane.style.cursor = '';
    state.ui.colHover = null;
    try { pane.releasePointerCapture(e.pointerId); } catch (err) { /* noop */ }
    render(); save();
  };
  pane.addEventListener('pointerup', end);
  pane.addEventListener('pointercancel', end);

  pane.addEventListener('dblclick', e => {
    const kind = hit(e);
    if (!kind) return;
    if (kind === 'label') state.ui.labelW = null;
    else state.ui.ownerW = null;
    render(); save();
    toast('已還原欄寬');
  });
}

    state.tasks.forEach(t => {
      const el = document.querySelector(`.task-item[data-id="${t.id}"]`);
      if (el) applyCardOpen(el, t.id);
    });
    updateExpandAllLabel();
  });

  /* ---- 24 色色塊彈出選單 ---- */
  $('#colorPopGrid').addEventListener('click', e => {
    const b = e.target.closest('[data-color]');
    if (b) pickColor(b.dataset.color);
  });
  document.addEventListener('pointerdown', e => {
    const pop = $('#colorPop');
    if (!pop || pop.hidden) return;
    if (pop.contains(e.target)) return;
    if (e.target.closest('[data-role="colorBtn"]')) return;
    closeColorPop();
  }, true);
  $('.panel').addEventListener('scroll', closeColorPop, { passive: true });
  window.addEventListener('resize', closeColorPop);

  $('#btnClear').addEventListener('click', () => {
    if (!state.tasks.length) return;
    if (!confirm('確定清空所有任務？此動作無法復原。')) return;
    state.tasks = [];
    state.ui.selectedId = null;
    renderList(); render(); save();
    toast('已清空任務');
  });

  $('#btnDemo').addEventListener('click', () => {
    if (!confirm('載入範例會覆蓋目前的專案內容，確定嗎？')) return;
    const th = state.ui.theme;
    const demo = demoState();
    state = cloud.enabled ? { ...state, project: demo.project, start: demo.start, tasks: demo.tasks } : demo;
    state.ui.theme = th;
    syncControls();
    save();
    toast('已載入範例專案');
  });

  const zoom = $('#zoom');
  zoom.addEventListener('input', e => {
    state.ui.dayW = clamp(Number(e.target.value) || 24, 7, 56);
    render(); save();
  });
  $('#zoomAuto').addEventListener('click', () => {
    state.ui.dayW = null;
    render(); save();
    toast('時間刻度已改為自動');
  });

  $('#chkWeekend').addEventListener('change', e => {
    state.ui.weekend = e.target.checked; render(); save();
  });
  $('#chkToday').addEventListener('change', e => {
    state.ui.today = e.target.checked; render(); save();
  });

  $$('#orientSeg button').forEach(btn => {
    btn.addEventListener('click', () => {
      state.ui.orient = btn.dataset.orient;
      $$('#orientSeg button').forEach(b => b.classList.toggle('active', b === btn));
      save();
    });
  });

  $('#btnPdf').addEventListener('click', () => exportImage('pdf'));
  $('#btnJpg').addEventListener('click', () => exportImage('jpg'));
  $('#btnXlsx').addEventListener('click', exportXlsx);

  /* ---- 專案儲存 / 開啟 ---- */
  $('#btnSave').addEventListener('click', () => {
    if (cloud.enabled) { cloud.saveProject(); return; }
    flushSave();
    const entry = saveProject(false);
    if (entry) toast(`已儲存「${entry.project || '未命名專案'}」`);
  });

  $('#btnSaveAs').addEventListener('click', () => {
    const name = prompt('另存新檔：請輸入專案名稱', state.project || '未命名專案');
    if (name == null) return;
    if (cloud.enabled) { cloud.saveProject(name.trim() || '未命名專案'); return; }
    flushSave();
    state.project = name.trim() || '未命名專案';
    const nameInput = $('#projName');
    if (nameInput) nameInput.value = state.project;
    const entry = saveProject(true);
    if (!entry) return;
    renderLibrary();
    toast(`已另存為「${entry.project}」`);
  });

  $('#btnNew').addEventListener('click', () => cloud.enabled ? cloud.newProject() : newProject());

  $('#btnOpen').addEventListener('click', openLibrary);
  $('#libClose').addEventListener('click', closeLibrary);
  $('#libModal').addEventListener('click', e => {
    if (e.target.id === 'libModal') closeLibrary();
  });
  $('#libList').addEventListener('click', e => {
    const openBtn = e.target.closest('[data-open]');
    if (openBtn) {
      if (cloud.enabled) cloud.openProject(openBtn.dataset.open);
      else openProject(openBtn.dataset.open);
      return;
    }
    const delBtn = e.target.closest('[data-del]');
    if (delBtn) {
      if (cloud.enabled) cloud.deleteProject(delBtn.dataset.del);
      else deleteProject(delBtn.dataset.del);
    }
  });
  $('#libNew').addEventListener('click', () => {
    if (cloud.enabled) { cloud.saveProject(); return; }
    const entry = saveProject(false);
    if (!entry) return;
    renderLibrary();
    toast(`已儲存「${entry.project || '未命名專案'}」`);
  });

  $('#btnExportProj').addEventListener('click', exportProjectFile);
  $('#btnImportProj').addEventListener('click', () => $('#fileImport').click());
  $('#fileImport').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    importProjectFile(f);
  });

  $('#chartScroll').addEventListener('scroll', syncLabelScroll, { passive: true });

  // 在左側任務欄滾輪時，同步捲動時間軸
  $('#labelPane').addEventListener('wheel', e => {
    const sc = $('#chartScroll');
    if (sc.scrollHeight > sc.clientHeight) {
      sc.scrollTop += e.deltaY;
      e.preventDefault();
    }
  }, { passive: false });

  // 視窗尺寸變化：自動刻度時重繪
  let pending = false;
  const ro = new ResizeObserver(() => {
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => {
      pending = false;
      if (state.ui.dayW == null) render();
    });
  });
  ro.observe($('#chartScroll'));

  window.addEventListener('resize', () => {
    applyPanelWidth();
    if (state.ui.dayW == null) render();
  });

  // 快捷鍵：Alt+N 新增任務、Esc 關閉視窗
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (!$('#colorPop').hidden) { closeColorPop(); return; }
      if (!$('#libModal').hidden) closeLibrary();
      return;
    }
    if (e.altKey && (e.key === 'n' || e.key === 'N')) {
      if (cloud.enabled && !cloud.canEdit()) return;
      e.preventDefault();
      addTask();
    }
  });

  // 關閉頁面前確保最後的編輯已寫入
  window.addEventListener('beforeunload', flushSave);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flushSave();
  });
}

if (!cloud.enabled) probeStorage();
bindUI();
bindChartEvents();
bindSplitter();
bindLabelResize();
syncControls();
if (cloud.enabled) cloud.init();

</script>
</body>
</html>
